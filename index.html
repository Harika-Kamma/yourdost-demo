<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Next Step Navigator – YourDOST prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap">
<style>
:root{--bg:#eef5f4;--card:#fff;--ink:#1d2d33;--muted:#5b6f76;--teal:#1f8a86;--teal-d:#146663;--lav:#e6e0f5;--lav-d:#5b4a9a;--line:#d3e2e0;--warn:#fff3e3;--warn-ink:#7a4a0c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141d20;--card:#1d2a2e;--ink:#e8f1f0;--muted:#9fb3b8;--teal:#4cc3bd;--teal-d:#7fdcd6;--lav:#2d2850;--lav-d:#c4b8f5;--line:#2f4247;--warn:#3a2c17;--warn-ink:#f2c689}}
:root[data-theme="dark"]{--bg:#141d20;--card:#1d2a2e;--ink:#e8f1f0;--muted:#9fb3b8;--teal:#4cc3bd;--teal-d:#7fdcd6;--lav:#2d2850;--lav-d:#c4b8f5;--line:#2f4247;--warn:#3a2c17;--warn-ink:#f2c689}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.55 Figtree,system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 18px 60px}
h1,h2{font-family:Fraunces,Georgia,serif;font-weight:600;line-height:1.2;margin:.2em 0 .4em}
h1{font-size:2.1rem}h2{font-size:1.5rem}
p{margin:.4em 0 1em}
.muted{color:var(--muted);font-size:.95rem}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0 22px}
.bar i{display:block;height:100%;background:var(--teal);width:0;transition:width .4s}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
.notice{background:var(--lav);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:.92rem;margin:14px 0}
button{font:inherit;cursor:pointer;border-radius:12px;border:1.5px solid var(--teal);background:transparent;color:var(--teal-d);padding:11px 18px;min-height:46px}
button.primary{background:var(--teal);color:#fff;border-color:var(--teal)}
:root[data-theme="dark"] button.primary,:root:not([data-theme="light"]) button.primary{color:#0c1b1c}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--lav-d);outline-offset:2px}
textarea,input[type=text]{width:100%;font:inherit;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);resize:vertical}
label.q{display:block;font-weight:600;margin:20px 0 8px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);color:var(--ink);padding:9px 14px}
.chip[aria-pressed=true]{background:var(--lav);border-color:var(--lav-d);color:var(--ink)}
.mood .chip{font-size:1.6rem;padding:6px 14px;min-width:56px}
.personas{margin-top:22px;border-top:1px dashed var(--line);padding-top:14px}
.personas button{font-size:.9rem;min-height:40px;padding:8px 12px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.rec{border-left:6px solid var(--teal)}
.badge{display:inline-block;font-size:.85rem;padding:2px 10px;border-radius:20px;background:var(--lav);color:var(--ink);margin-left:6px}
.why{background:var(--bg);border-radius:12px;padding:12px 14px;margin:12px 0;font-size:.97rem}
.alt{margin-top:12px}.alt h3{font-size:1.05rem;margin:0 0 2px}
.crisis{border:2px solid var(--lav-d)}
.crisis a{color:var(--teal-d);font-weight:600}
.num{font-size:1.2rem;font-weight:600;margin:4px 0}
.theme-toggle{float:right;min-height:36px;padding:4px 12px;font-size:.85rem}
.warn{background:var(--warn);color:var(--warn-ink);border-radius:12px;padding:12px 14px;margin:14px 0;font-size:.95rem}
.hidden{display:none}
h1:focus,h2:focus{outline:none}
.log{display:flex;flex-direction:column;gap:10px;margin:12px 0;max-height:55vh;overflow:auto}
.b{padding:10px 14px;border-radius:14px;max-width:88%;white-space:pre-wrap}
.b.bot{background:var(--card);border:1px solid var(--line)}
.b.me{background:var(--lav);align-self:flex-end}
.cin{display:flex;gap:8px;align-items:flex-end}
</style>
</head>
<body>
<main>
<button class="theme-toggle" id="theme" aria-label="Toggle dark mode">Dark / light</button>
<div class="bar" aria-hidden="true"><i id="prog"></i></div>
<div id="app" aria-live="polite"></div>
</main>
<script>
"use strict";
var SERVICES={
 counseling:{name:"1:1 online counseling",blurb:"A private session with a trained counselor to talk things through."},
 selfhelp:{name:"Self-help library",blurb:"Short articles and audio you can use on your own, right now."},
 assess:{name:"Wellbeing assessment",blurb:"A 5-minute stress and burnout check that shows where you stand."},
 group:{name:"Group wellbeing program",blurb:"A guided workshop or peer circle with colleagues."},
 sleep:{name:"Sleep and relaxation exercises",blurb:"Wind-down audio and breathing routines for better rest."}
};
var THEMES=[
 {label:"sleep trouble",kw:/sleep|insomnia|awake|nights?|restless|tossing/i,w:{sleep:5,selfhelp:2,counseling:1}},
 {label:"work pressure",kw:/deadline|workload|pressure|overwhelm|stress|manager|target|too much|meeting|boss/i,w:{assess:3,counseling:3,selfhelp:2}},
 {label:"burnout signs",kw:/burn(ed|t)? ?out|exhaust|drained|tired all|no energy|fatigue|can'?t keep up|numb/i,w:{assess:5,counseling:3,sleep:1}},
 {label:"low mood",kw:/sad|low|empty|hopeless|down|crying|worthless|no motivation|unmotivated|flat|depress/i,w:{counseling:6,selfhelp:1}},
 {label:"anxiety",kw:/anxi|panic|worry|worried|nervous|racing|on edge|dread|scared/i,w:{selfhelp:4,counseling:3,sleep:2}},
 {label:"feeling isolated",kw:/lonely|alone|isolated|no one|nobody|new city|remote|miss (home|family)|left out/i,w:{group:6,counseling:2}}
];
var CRISIS=/kill myself|suicid|end my life|end it all|want to die|don'?t want to (live|be here)|hurt myself|self[- ]harm|no reason to live|better off (dead|without me)|cut myself|not worth living|point in living|see the point/i;
var PERSONAS=[
 {label:"Stressed by deadlines",text:"I have three deadlines this week and my manager keeps adding work. I feel overwhelmed and can't switch off."},
 {label:"Can't sleep for weeks",text:"I lie awake until 3am most nights and my mind keeps racing. I'm tired all day."},
 {label:"Feeling alone",text:"I moved to a new city for this job and I feel really alone. I eat lunch by myself every day."},
 {label:"Crisis-style message",text:"I don't see the point in living anymore. Everyone would be better off without me."}
];
var S={res:null,skip:0};
var app=document.getElementById("app"),prog=document.getElementById("prog");
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function go(fn,p){fn();prog.style.width=p+"%";window.scrollTo(0,0);var h=app.querySelector("h1,h2");if(h){h.setAttribute("tabindex","-1");h.focus({preventScroll:true})}}

/* Offline fallback engine, used only if the AI service cannot be reached */
function analyse(text){
 var sc={counseling:0,selfhelp:0,assess:0,group:0,sleep:0},found=[];
 THEMES.forEach(function(t){if(t.kw.test(text)){found.push(t);for(var k in t.w)sc[k]+=t.w[k]}});
 if(!found.length){sc.selfhelp+=2;sc.assess+=1}
 var order=Object.keys(sc).sort(function(a,b){return sc[b]-sc[a]});
 var top=sc[order[0]],gap=top-sc[order[1]];
 return{order:order,found:found,conf:(found.length&&top>=7&&gap>=2)?"High":(found.length&&top>=4)?"Medium":"Low"};
}
var WHY={counseling:"Talking with a counselor helps most when things weigh on you for a while.",selfhelp:"Small, practical tools you can try today are a good first move, with no booking needed.",assess:"A quick check shows whether stress or burnout is building, so your next step is based on facts.",group:"Connecting with others who feel the same can ease isolation.",sleep:"Better sleep often makes stress and low mood easier to handle."};
function whyLocal(r){var t=r.found.map(function(x){return x.label});return(t.length?"You mentioned "+t.slice(0,2).join(" and ")+". ":"You shared a little about how you feel. ")+WHY[r.order[0]]}

function welcome(){go(function(){
 app.innerHTML='<h1>Not sure which support is right for you? Let’s talk it through.</h1>'+
 '<p>Tell the Navigator how you’re feeling in your own words. It asks a couple of questions, then suggests the one YourDOST service that fits best. It takes about two minutes.</p>'+
 '<div class="notice"><b>Demo notice:</b> Use fictional details only. Nothing is stored. Your messages are sent to an AI service to write replies.</div>'+
 '<div class="actions"><button class="primary" id="start">Start chat</button></div>'+
 '<p class="muted" style="margin-top:22px">This is guidance to help you choose a service, not a diagnosis or therapy.</p>';
 document.getElementById("start").onclick=chat;},0)}

function chat(){go(function(){var hist=[],live=null;
 app.innerHTML='<h2>Chat with the Navigator</h2><p class="muted" id="mode">Connecting…</p>'+
 '<div class="log" id="log"></div>'+
 '<div class="cin"><textarea id="ci" rows="2" aria-label="Your message" placeholder="Type how you’re feeling…"></textarea><button class="primary" id="send">Send</button></div>'+
 '<div class="personas"><div class="muted" style="margin-bottom:8px">Demo: tap to fill in a fictional person, then press Send</div><div class="row" id="pp"></div></div>'+
 '<div class="notice">Use fictional details only. This is guidance, not therapy or a diagnosis.</div>'+
 '<div class="actions"><button id="bk">Back</button></div>';
 var log=document.getElementById("log"),ci=document.getElementById("ci"),sb=document.getElementById("send"),mode=document.getElementById("mode");
 mode.textContent="Tell me what’s going on. I’ll ask a couple of questions, then suggest one next step.";
 PERSONAS.forEach(function(p){var b=document.createElement("button");b.textContent=p.label;b.onclick=function(){ci.value=p.text;ci.focus()};document.getElementById("pp").appendChild(b)});
 function add(c,t){var d=document.createElement("div");d.className="b "+c;d.textContent=t;log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
 add("bot","Hi, I’m the Navigator. How are you feeling today?");
 function local(){var n=hist.filter(function(m){return m.role==="user"}).length,all=hist.map(function(m){return m.content}).join(" "),r=analyse(all);
  if(n<2&&r.conf==="Low")return{reply:"Thanks for sharing that. What part of your day feels hardest right now?",ready:false};
  return{reply:"Thank you for telling me. Here’s what I’d suggest.",ready:true,primary:r.order[0],alternatives:[r.order[1],r.order[2]],confidence:r.conf,why:whyLocal(r)}}
 async function send(){
  var t=ci.value.trim();if(!t||sb.disabled)return;ci.value="";add("me",t);hist.push({role:"user",content:t});
  if(CRISIS.test(hist.filter(function(m){return m.role==="user"}).map(function(m){return m.content}).join(" ")))return crisis(); /* fixed safety rule, runs before any AI */
  var typing=add("bot","…"),data,why="";sb.disabled=true;
  try{var res=await fetch("/.netlify/functions/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:hist})});
   if(!res.ok)throw new Error("HTTP "+res.status);data=await res.json();live=true}
  catch(e){data=local();live=false;why=" ("+e.message+")"}
  sb.disabled=false;
  mode.textContent=live?"AI mode: live":"Offline demo mode: the AI service is not reachable, so the built-in engine is answering"+why+".";
  if(data.crisis)return crisis();
  typing.textContent=data.reply||"Tell me a little more?";hist.push({role:"assistant",content:typing.textContent});
  if(data.ready&&SERVICES[data.primary]){
   var order=[data.primary].concat(data.alternatives||[]).filter(function(k){return SERVICES[k]});Object.keys(SERVICES).forEach(function(k){if(order.indexOf(k)<0)order.push(k)});
   S.res={order:order,conf:data.confidence||"Medium",why:data.why,live:live};S.skip=0;
   var b=document.createElement("button");b.className="primary";b.textContent="See my next step";b.onclick=function(){result(chat)};log.appendChild(b);log.scrollTop=log.scrollHeight;sb.disabled=true;ci.disabled=true}
  else ci.focus()}
 sb.onclick=send;ci.addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});
 document.getElementById("bk").onclick=welcome;ci.focus();},40)}

function crisis(){go(function(){
 app.innerHTML='<div class="card crisis"><h2>You don’t have to handle this alone</h2>'+
 '<p>What you wrote sounds really painful. Please talk to a real person right now. Support is free and available.</p>'+
 '<div class="num">Tele-MANAS: <a href="tel:14416">14416</a></div><div class="num">KIRAN: <a href="tel:18005990019">1800-599-0019</a></div>'+
 '<p class="muted">Confirm these numbers before real use. If you are in immediate danger, call 112 or go to the nearest hospital.</p>'+
 '<div class="actions"><button class="primary" id="cc">Connect to a YourDOST counselor now</button></div>'+
 '<p id="ccm" class="notice hidden">Demo only: the real product would open an immediate chat or call with an on-duty counselor.</p>'+
 '<p class="muted">Is someone with you? Consider telling a friend, family member or colleague you trust.</p></div>'+
 '<div class="actions"><button id="bk">Back to start</button></div>';
 document.getElementById("cc").onclick=function(){document.getElementById("ccm").classList.remove("hidden")};
 document.getElementById("bk").onclick=welcome;},100)}

function result(back){go(function(){
 var r=S.res,n=r.order.length-2,i=S.skip%n,prim=r.order[i],alts=[r.order[i+1],r.order[i+2]],cf=S.skip?"Medium":r.conf;
 var why=(i===0&&r.why)?r.why:WHY[prim];
 var h='<h2>Your suggested next step</h2><div class="card rec"><h3 style="margin:0;font-size:1.25rem">'+SERVICES[prim].name+'<span class="badge">'+cf+' confidence</span></h3>'+
 '<p style="margin:6px 0">'+SERVICES[prim].blurb+'</p><div class="why"><b>Why this?</b> '+esc(why)+'</div><button class="primary" id="st">Start</button> <span id="stm" class="muted"></span></div>';
 if(cf==="Low")h+='<div class="notice">We’re not very sure about this one. A counselor can help you decide.</div>';
 h+='<h3 style="margin:24px 0 4px;font-size:1.05rem">Other options that may help</h3>';
 alts.forEach(function(k){h+='<div class="card alt"><h3>'+SERVICES[k].name+'</h3><div class="muted">'+SERVICES[k].blurb+'</div></div>'});
 h+='<div class="actions"><button id="try">Not quite right? Show me another</button></div>'+
 '<div class="card" style="margin-top:22px"><b>Was this helpful?</b> <button class="chip" data-f="up" aria-label="Helpful">👍</button> <button class="chip" data-f="down" aria-label="Not helpful">👎</button><div id="fbm" class="muted"></div></div>'+
 '<p class="muted" style="margin-top:18px">'+(r.live?"Written by AI. ":"")+'This is guidance, not a diagnosis. If you ever feel unsafe, <a href="#" id="hc" style="color:var(--teal-d)">talk to a human now</a>.</p>'+
 '<div class="actions"><button id="bk">Back to chat</button><button id="re">Start over</button></div>';
 app.innerHTML=h;
 document.getElementById("st").onclick=function(){document.getElementById("stm").textContent="Demo: this would open “"+SERVICES[prim].name+"” in YourDOST."};
 document.getElementById("try").onclick=function(){S.skip=(S.skip+1)%n;result(back)};
 app.querySelectorAll("[data-f]").forEach(function(b){b.onclick=function(){document.getElementById("fbm").textContent=b.dataset.f==="up"?"Thanks! That helps us improve.":"Thanks. Try “show me another”, or talk to a counselor."}});
 document.getElementById("hc").onclick=function(e){e.preventDefault();crisis()};
 document.getElementById("bk").onclick=back;document.getElementById("re").onclick=welcome;},90)}

document.getElementById("theme").onclick=function(){var d=document.documentElement,c=d.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");d.setAttribute("data-theme",c==="dark"?"light":"dark")};
welcome();
</script>
</body>
</html>
